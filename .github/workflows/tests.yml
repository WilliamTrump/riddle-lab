name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: node --test tests/*.test.js
      - run: cd puzzles/prisoner-hats && python -m pytest
      - run: cd puzzles/parachuting-robots && python -m pytest
      - run: cd puzzles/egg-drop && python -m pytest
